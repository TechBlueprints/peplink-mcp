[project]
name = "peplink-mcp-shared"
version = "0.0.0"
description = "Shared MCP runtime: config, tiers, policy gates, tool registration"
requires-python = ">=3.12"
dependencies = [
    "peplink-core",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peplink_mcp_shared"]

[tool.uv.sources]
peplink-core = { workspace = true }
