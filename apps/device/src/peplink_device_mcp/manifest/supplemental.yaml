# Supplemental surfaces — NOT part of official 100% coverage metric.
# Community/undocumented endpoint surfaces (REST, vendor CGI, NMEA TCP) + AP SNMP.

supplemental_count: 41

endpoints:
  - id: get_status_traffic
    method: GET
    path: /api/status.traffic
    tier: read_only
    tool: peplink_supplemental_get_status_traffic
    source: community

  - id: get_status_bandwidth_usage_client
    method: GET
    path: /api/status.bandwidthUsage.client
    tier: read_only
    tool: peplink_supplemental_get_status_bandwidth_usage_client
