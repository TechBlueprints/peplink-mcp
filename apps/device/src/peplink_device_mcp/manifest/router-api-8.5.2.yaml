# Official Peplink Router REST API — firmware 8.5.2 PDF reference list.
# Source: Peplink-Router-API-Documentation-for-Firmware-8.5.2
# Coverage CI requires every entry to have a registered MCP tool.

api_version: "8.5.2"
official_count: 59

endpoints:
