[project]
name = "peplink-device-mcp"
version = "0.0.0"
description = "MCP server for direct Peplink device API access (LAN)"
requires-python = ">=3.12"
dependencies = [
    "peplink-core",
    "peplink-mcp-shared",
    "peplink-ic2",
    "mcp>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
peplink-device-mcp = "peplink_device_mcp.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peplink_device_mcp"]

[tool.uv.sources]
peplink-core = { workspace = true }
peplink-mcp-shared = { workspace = true }
peplink-ic2 = { workspace = true }

[tool.hatch.build.targets.wheel.force-include]
"src/peplink_device_mcp/manifest" = "peplink_device_mcp/manifest"
